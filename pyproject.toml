[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mri-dataset-tool"
version = "0.1.0"
description = "Tool for preparing MRI datasets for machine learning"
requires-python = ">=3.14"
dependencies = [
    "pydicom>=3.0",
    "nibabel>=5.0",
    "numpy>=2.0",
    "scipy>=1.0",
    "pyyaml>=6.0",
    "psutil>=5.9",
    "openpyxl>=3.1"
]

[project.scripts]
mri-dataset = "mri_dataset_tool.presentation.cli.main:main"

[project.gui-scripts]
mri-dataset-gui = "mri_dataset_tool.presentation.gui.app:main"

[project.optional-dependencies]
dev = [
    "pytest>=9.1"
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]